<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6B57">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Stocks">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<title>Stocks</title>
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#F5F8F6; --ink:#16302B; --muted:#5B6F6A; --line:#D3DCD8;
  --accent:#0F6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEBE5;
  --dem:#C0392B; --rem:#C98A0B; --don:#3D6FB6; --ret:#7A5BA8; --ok:#2E7D4F; --neutral:#6B7C78;
  --font:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --cond:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0E1716; --surface:#16211F; --surface2:#1C2926; --ink:#E4ECE9; --muted:#93A6A1; --line:#2A3A37;
    --accent:#3FB28F; --accent-ink:#06201A; --accent-soft:#1E3A33;
    --dem:#E5645A; --rem:#F0B53A; --don:#6E9BE0; --ret:#A98BD6; --ok:#5CC08A; --neutral:#8C9C98;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--font);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.num{font-family:var(--cond);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .small{font-size:14px} .tiny{font-size:12.5px}
h1,h2,h3{font-family:var(--cond);font-weight:600;margin:0;letter-spacing:.01em}
h2{font-size:22px} h3{font-size:18px}

/* En-tête */
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 8px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--cond);font-weight:700;font-size:26px;line-height:1}
.brand small{display:block;font:500 13px/1.2 var(--font);color:var(--muted);margin-top:2px}
.top .sp{flex:1}
.iconbtn{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0 10px;gap:6px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--ok);display:inline-block}
.dot.off{background:var(--rem)}

main{padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}

/* Barre d'onglets */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:space-around;align-items:flex-end;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;color:var(--muted);min-width:60px;min-height:48px;cursor:pointer;padding:4px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs svg{width:24px;height:24px}
nav.tabs .scan{background:var(--accent);color:var(--accent-ink)!important;border-radius:16px;min-width:74px;min-height:58px;margin-top:-18px;box-shadow:0 4px 12px rgba(15,107,87,.35);font-weight:600}

/* Blocs */
.block{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.block.flat{background:transparent;border-style:dashed}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:10px}
.big{font-family:var(--cond);font-weight:700;font-size:44px;line-height:1;font-variant-numeric:tabular-nums}
.mid{font-family:var(--cond);font-weight:600;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kv>div{background:var(--surface2);border-radius:10px;padding:10px}
.kv .l{font-size:13px;color:var(--muted)}

/* Étiquettes de mouvement (forme d'étiquette de gondole) */
.tag{display:inline-flex;align-items:center;font:600 14px/1 var(--cond);letter-spacing:.02em;padding:5px 9px 5px 13px;color:#fff;background:var(--neutral);clip-path:polygon(7px 0,100% 0,100% 100%,7px 100%,0 50%);border-radius:0 4px 4px 0;white-space:nowrap}
.t-demarque{background:var(--dem)} .t-remise{background:var(--rem);color:#2A1D00} .t-don{background:var(--don)} .t-retour{background:var(--ret)}
.t-reception,.t-transfo_entree,.t-cession_entree{background:var(--ok)} .t-annulation{background:var(--neutral)}

/* Niveaux */
.lvl{display:inline-flex;gap:2px;align-items:center;vertical-align:middle}
.lvl i{width:7px;height:14px;border-radius:2px;background:var(--line)}
.lvl i.on{background:var(--accent)}
.lvlrow{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.lvlrow div{background:var(--surface2);border-radius:8px;padding:8px 4px;text-align:center}
.lvlrow b{display:block;font:700 24px/1 var(--cond)}

/* Barres */
.bar{margin:8px 0}
.bar .lab{display:flex;justify-content:space-between;font-size:14.5px;gap:8px}
.bar .tr{height:8px;background:var(--surface2);border-radius:4px;overflow:hidden;margin-top:4px}
.bar .fi{height:100%;background:var(--dem);border-radius:4px}

/* Formulaires */
label.f{display:block;margin-bottom:12px}
label.f>span{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
input[type=text],input[type=number],input[type=email],input[type=password],input[type=search],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-size:16px}
textarea{min-height:70px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px;accent-color:var(--accent)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:16px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--dem);border-color:var(--dem);background:transparent}
.btn.block100{width:100%}
.btn.sm{min-height:38px;padding:0 12px;font-size:14.5px;border-radius:9px}
.btn[disabled]{opacity:.45;pointer-events:none}

.seg{display:flex;background:var(--surface2);border-radius:11px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:none;min-height:40px;border-radius:9px;padding:0 10px;cursor:pointer;white-space:nowrap;font-size:15px}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.12)}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:22px;min-height:42px;padding:0 14px;cursor:pointer;font-size:15px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

/* Listes */
.list{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dayhead{font:600 15px/1 var(--cond);color:var(--muted);margin:16px 2px 6px}
.empty{text-align:center;padding:28px 16px;color:var(--muted)}
.empty .btn{margin-top:12px}

/* Scanner */
.reader-wrap{position:relative;background:#000;border-radius:14px;overflow:hidden;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;color:#cfd8d5}
#reader{width:100%}
#reader video{width:100%!important;height:auto!important;object-fit:cover}
.fav{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.fav button{min-height:58px;border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:8px 10px;text-align:left;cursor:pointer;font-size:14.5px;font-weight:600;line-height:1.2}
.fav button span{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}

/* Panneau de saisie */
.veil{position:fixed;inset:0;background:rgba(8,20,17,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .18s}
.veil.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--bg);border-radius:18px 18px 0 0;max-height:92%;overflow-y:auto;transform:translateY(102%);transition:transform .22s ease-out;padding:10px 16px calc(20px + env(safe-area-inset-bottom,0px));max-width:760px;margin:0 auto}
.sheet.open{transform:none}
.grip{width:44px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-title{font:600 24px/1.1 var(--cond)}
.qty{display:flex;align-items:stretch;gap:8px}
.qty button{min-width:58px;min-height:58px;font-size:26px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.qty input{text-align:center;font:700 30px/1 var(--cond)!important;min-height:58px!important}
.qty .u{align-self:center;font-weight:600;min-width:52px}
.note{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:14.5px}
.warn{background:color-mix(in srgb,var(--rem) 18%,transparent);border-radius:10px;padding:10px 12px;font-size:14.5px}
.err{background:color-mix(in srgb,var(--dem) 15%,transparent);border-radius:10px;padding:10px 12px;font-size:14.5px}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;z-index:60;font-weight:600;max-width:90%;text-align:center;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* Connexion */
.login{max-width:380px;margin:12vh auto 0;padding:0 20px}
.login .brand{font-size:44px;margin-bottom:6px}

@media (prefers-reduced-motion:reduce){.sheet,.veil{transition:none}}
@media (min-width:760px){ .sheet{bottom:24px;border-radius:18px} }
</style>
</head>
<body>
<div id="app"></div>
<div class="veil" id="veil"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div id="toast"></div>

<script>
(function(){
'use strict';

/* ============================================================
   CONSTANTES ET MODÈLE DE DONNÉES (prévu pour toutes les versions)
   ============================================================ */
const VERSION = '1.0.0';
const CFG = window.STOCKS_CONFIG || {};
const MAG = CFG.magasinId || 'la-vaugine';
const LOCAL = !CFG.firebase;
const LIB_SCAN = 'https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';

// Types de mouvements. sens : effet sur le stock (+1 entrée, -1 sortie, 0 sans effet).
// V1 : demarque, don, retour, remise, annulation. Les autres sont prévus pour les versions suivantes.
const TYPES = {
  demarque:       {nom:'Démarque',            sens:-1, v:1},
  don:            {nom:'Don',                 sens:-1, v:1},
  retour:         {nom:'Retour fournisseur',  sens:-1, v:1},
  remise:         {nom:'Remise',              sens: 0, v:1},
  annulation:     {nom:'Annulation',          sens: 0, v:1},
  reception:      {nom:'Réception',           sens: 1, v:3},
  vente:          {nom:'Vente',               sens:-1, v:2},
  comptage:       {nom:'Comptage',            sens: 0, v:2},
  correction:     {nom:'Correction de stock', sens: 0, v:4},
  transfo_sortie: {nom:'Transformation (matière)', sens:-1, v:5},
  transfo_entree: {nom:'Transformation (produit fini)', sens:1, v:5},
  cession_sortie: {nom:'Cession vers un rayon', sens:-1, v:5},
  cession_entree: {nom:'Cession depuis un rayon', sens:1, v:5}
};
const ACTIONS_V1 = ['demarque','don','remise','retour'];

const NIVEAUX = [
  {n:0, nom:'Non suivie',       desc:'Produit repéré, pas encore suivi.'},
  {n:1, nom:'Connue',           desc:'Fiche créée, démarque enregistrée.'},
  {n:2, nom:'Contrôlée',        desc:'Entre dans le tirage des contrôles ponctuels.'},
  {n:3, nom:'Sous surveillance',desc:'Écart trouvé : comptage fréquent jusqu’à correction de la cause.'},
  {n:4, nom:'Stock fiable',     desc:'Écarts dans la tolérance sur plusieurs contrôles.'},
  {n:5, nom:'Commande pilotée', desc:'Stock assez sûr pour calculer et évaluer ses commandes.'}
];
const UNITES = {kg:'kg', piece:'pièce', unite:'unité'};

const DEF_RAYONS = [
  ['Fruits et légumes',false],['Crèmerie',false],['Fromage libre-service',false],['Fromage à la coupe',true],
  ['Charcuterie libre-service',false],['Charcuterie à la coupe',true],['Traiteur libre-service',false],['Traiteur à la coupe',true],
  ['Boucherie libre-service',false],['Boucherie traditionnelle',true],['Volaille',false],['Poissonnerie',true],
  ['Surgelés',false],['Boulangerie-pâtisserie',true]
];
const DEF_PARAMS = {
  motifs: [
    {id:'perime',  nom:'Périmé (DLC/DDM dépassée)', actif:true},
    {id:'casse',   nom:'Casse / abîmé',             actif:true},
    {id:'tri',     nom:'Tri / parage',              actif:true},
    {id:'froid',   nom:'Rupture chaîne du froid',   actif:true},
    {id:'interne', nom:'Consommation interne',      actif:true},
    {id:'transfo', nom:'Perte de transformation',   actif:true},
    {id:'autre',   nom:'Autre',                     actif:true}
  ],
  donsDansDemarque: false,
  tauxRemise: [30, 50],
  codesVariables: {actif:true, prefixes:'2', debutArticle:0, longArticle:7, debutValeur:7, longValeur:5, typeValeur:'prix'},
  toleranceDefaut: 2
};

/* ============================================================
   OUTILS
   ============================================================ */
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-'+Date.now().toString(36)+Math.random().toString(36).slice(2,10));
const iso = d => { const z = new Date(d.getTime() - d.getTimezoneOffset()*60000); return z.toISOString().slice(0,10); };
const num = v => { if (v===null || v===undefined || v==='') return NaN; return parseFloat(String(v).replace(',', '.').replace(/\s/g,'')); };
const r2 = x => Math.round(x*100)/100;
const r3 = x => Math.round(x*1000)/1000;
const fmtN = (x,d=2) => isFinite(x) ? x.toLocaleString('fr-FR',{maximumFractionDigits:d}) : '–';
const plur = (q, s, p) => (Math.abs(q) > 1 ? p : s);
const fmtQ = (q,u) => u==='kg' ? fmtN(q,3)+' kg' : fmtN(q,2)+' '+(u==='piece' ? plur(q,'pièce','pièces') : plur(q,'unité','unités'));
const eur = v => !isFinite(v) ? '–' : (S.discret ? '••• €' : v.toLocaleString('fr-FR',{style:'currency',currency:'EUR'}));
const pct = (a,b) => b ? fmtN(a/b*100,1)+' %' : '–';
const clone = o => JSON.parse(JSON.stringify(o));
const heure = ts => { try { return new Date(ts).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); } catch(e){ return ''; } };
const jourLong = j => { const d = new Date(j+'T12:00:00'); const t = iso(new Date()); const h = new Date(); h.setDate(h.getDate()-1);
  if (j===t) return 'Aujourd’hui'; if (j===iso(h)) return 'Hier';
  return d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'}); };
const ls = {
  get(k,d){ try{ const v = localStorage.getItem(k); return v===null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
function eanValide(code){
  if (!/^\d+$/.test(code) || ![8,12,13].includes(code.length)) return null; // pas un EAN/UPC : on ne juge pas
  const d = code.split('').map(Number); const cle = d.pop();
  let s = 0; d.reverse().forEach((x,i) => { s += x * (i%2===0 ? 3 : 1); });
  return (10 - s%10) % 10 === cle;
}
function deepMerge(base, o){
  const r = clone(base);
  if (!o) return r;
  Object.keys(o).forEach(k => {
    if (o[k] && typeof o[k]==='object' && !Array.isArray(o[k]) && r[k] && typeof r[k]==='object' && !Array.isArray(r[k])) r[k] = deepMerge(r[k], o[k]);
    else r[k] = o[k];
  });
  return r;
}
let toastT;
function toast(msg){ const t = $('#toast'); t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toastT); toastT = setTimeout(()=>{ t.innerHTML=''; }, 2600); }
function vibre(){ try{ navigator.vibrate && navigator.vibrate(60); }catch(e){} }

/* ============================================================
   ÉTAT
   ============================================================ */
const S = {
  pret:false, user:null, erreurInit:'',
  produits:[], rayons:[], mouvements:[], params:clone(DEF_PARAMS),
  vue:'accueil', periode:'jour',
  discret: ls.get('stocks-discret', true),
  rafale: ls.get('stocks-rafale', true),
  pf:{q:'', rayon:'', niveau:''},
  jf:{periode:'7j', type:'', rayon:''},
  scanQ:'', camOn:false, camErr:'', camPause:false,
  sheet:null,
  enLigne: navigator.onLine
};

/* ============================================================
   COUCHE DE DONNÉES : local (appareil) ou Firebase (synchronisé)
   Chemins Firebase : magasins/{magasin}/produits | rayons | mouvements | parametres/general
   ============================================================ */
const LS_KEY = 'stocks-donnees-'+MAG;
let db = null, auth = null, unsubs = [];

const Store = {
  async init(){
    if (LOCAL){
      const d = ls.get(LS_KEY, null);
      if (d){ S.produits = d.produits||[]; S.rayons = d.rayons||[]; S.mouvements = d.mouvements||[]; S.params = deepMerge(DEF_PARAMS, d.params); }
      if (!S.rayons.length) semerRayons();
      S.user = {uid:'local', email:''}; S.pret = true; render();
      return;
    }
    if (typeof firebase === 'undefined'){ S.erreurInit = 'Firebase n’a pas pu être chargé. Au premier lancement, une connexion internet est nécessaire.'; S.pret = true; render(); return; }
    firebase.initializeApp(CFG.firebase);
    auth = firebase.auth(); db = firebase.firestore();
    try { await db.enablePersistence({synchronizeTabs:true}); } catch(e){ /* navigateur sans persistance : fonctionne en ligne */ }
    auth.onAuthStateChanged(u => {
      unsubs.forEach(f => f()); unsubs = [];
      S.user = u ? {uid:u.uid, email:u.email||''} : null;
      if (u) this.ecouter();
      S.pret = true; render();
    });
  },
  col(c){ return db.collection('magasins').doc(MAG).collection(c); },
  ecouter(){
    const err = e => { console.error(e); toast(e.code==='permission-denied' ? 'Accès refusé par Firebase : vérifie les règles de sécurité.' : 'Erreur de synchronisation.'); };
    unsubs.push(this.col('produits').onSnapshot(s => { S.produits = s.docs.map(d=>d.data()); render(); }, err));
    unsubs.push(this.col('rayons').onSnapshot(s => {
      S.rayons = s.docs.map(d=>d.data());
      if (!S.rayons.length && !s.metadata.fromCache) semerRayons();
      render();
    }, err));
    const depuis = new Date(); depuis.setDate(depuis.getDate()-400);
    unsubs.push(this.col('mouvements').where('jour','>=',iso(depuis)).onSnapshot(s => { S.mouvements = s.docs.map(d=>d.data()); render(); }, err));
    unsubs.push(this.col('parametres').doc('general').onSnapshot(d => {
      if (d.exists) S.params = deepMerge(DEF_PARAMS, d.data());
      else if (!d.metadata.fromCache) this.params(clone(DEF_PARAMS));
      render();
    }, err));
  },
  sauverLocal(){ ls.set(LS_KEY, {produits:S.produits, rayons:S.rayons, mouvements:S.mouvements, params:S.params}); },
  put(coll, obj){
    obj = clone(obj);
    if (LOCAL){
      const a = S[coll]; const i = a.findIndex(x => x.id===obj.id);
      if (i>=0) a[i] = obj; else a.push(obj);
      this.sauverLocal(); render(); return;
    }
    // Pas d'attente : l'écriture est visible tout de suite et se synchronise dès que le réseau revient.
    this.col(coll).doc(obj.id).set(obj).catch(e => { console.error(e); toast('Écriture refusée : '+(e.code||'erreur')); });
  },
  params(p){
    S.params = p;
    if (LOCAL){ this.sauverLocal(); render(); return; }
    this.col('parametres').doc('general').set(clone(p)).catch(e => toast('Réglages non enregistrés : '+(e.code||'erreur')));
  }
};

const rayon = id => S.rayons.find(r => r.id===id);
const rayonsTries = (tous) => S.rayons.filter(r => tous || r.actif!==false).sort((a,b)=>(a.ordre||0)-(b.ordre||0));

function annules(){ return new Set(S.mouvements.filter(m=>m.type==='annulation').map(m=>m.lienId)); }
function actifs(){ const a = annules(); return S.mouvements.filter(m => m.type!=='annulation' && !a.has(m.id)); }
const estDemarque = m => m.type==='demarque' || (m.type==='don' && S.params.donsDansDemarque);

function debutPeriode(p){
  const d = new Date();
  if (p==='7j') d.setDate(d.getDate()-6);
  else if (p==='30j') d.setDate(d.getDate()-29);
  else if (p==='mois') d.setDate(1);
  return iso(d);
}

// Stock théorique d'un produit : dernier comptage + mouvements postérieurs (actif à partir de la V2).
function stockTheorique(pid){
  const ms = actifs().filter(m => m.produitId===pid).sort((a,b) => a.ts < b.ts ? -1 : 1);
  let base = null, i0 = 0;
  for (let i=ms.length-1; i>=0; i--) if (ms[i].type==='comptage'){ base = num(ms[i].qte); i0 = i+1; break; }
  if (base===null) return null;
  let s = base;
  for (let i=i0; i<ms.length; i++){ const t = TYPES[ms[i].type]; if (t && t.sens) s += t.sens * (num(ms[i].qte)||0); }
  return s;
}

// Quantité d'une remise déjà jetée (démarque rattachée).
function jeteSurRemise(remiseId){
  return actifs().filter(m => m.type==='demarque' && m.lienId===remiseId).reduce((s,m)=>s+(num(m.qte)||0),0);
}
function remisesOuvertes(pid){
  return actifs().filter(m => m.type==='remise' && m.produitId===pid && m.jour >= debutPeriode('30j'))
    .map(m => ({m, reste: r3((num(m.qte)||0) - jeteSurRemise(m.id))}))
    .filter(x => x.reste > 0.0005)
    .sort((a,b)=> a.m.ts < b.m.ts ? 1 : -1);
}

function stats(p){
  const deb = debutPeriode(p);
  const ms = actifs().filter(m => m.jour >= deb);
  const val = m => num(m.valPA);
  const tot = (arr,k) => arr.reduce((s,m)=>s+(isFinite(num(m[k]))?num(m[k]):0),0);
  const dem = ms.filter(estDemarque);
  const parRayon = {}, parMotif = {}, parProd = {};
  dem.forEach(m => {
    const v = isFinite(val(m)) ? val(m) : 0;
    const kr = m.rayonId || '_';
    (parRayon[kr] = parRayon[kr] || {v:0,n:0}); parRayon[kr].v += v; parRayon[kr].n++;
    const km = m.type==='don' ? 'don' : (m.motif||'autre');
    (parMotif[km] = parMotif[km] || {v:0,n:0}); parMotif[km].v += v; parMotif[km].n++;
    (parProd[m.produitId] = parProd[m.produitId] || {v:0,n:0,nom:m.produitNom}); parProd[m.produitId].v += v; parProd[m.produitId].n++;
  });
  const remises = ms.filter(m => m.type==='remise');
  const idsRem = new Set(remises.map(m=>m.id));
  const jetesRem = actifs().filter(m => m.type==='demarque' && m.lienId && idsRem.has(m.lienId));
  const valRem = tot(remises,'valPV'), valJeteRem = jetesRem.reduce((s,m)=>{ const r = remises.find(x=>x.id===m.lienId); return s + (r && isFinite(num(r.pv)) ? (num(m.qte)||0)*num(r.pv) : 0); },0);
  return {
    dem, nDem: dem.length, valDemPA: tot(dem,'valPA'), valDemPV: tot(dem,'valPV'),
    sansPrix: dem.filter(m => !isFinite(num(m.valPA))).length,
    parRayon, parMotif, parProd,
    remises, valRemPV: valRem, manqueRem: tot(remises,'manque'), nJetesRem: jetesRem.length,
    ecoulement: valRem ? Math.max(0, 1 - valJeteRem/valRem) : null,
    dons: ms.filter(m=>m.type==='don'), retours: ms.filter(m=>m.type==='retour')
  };
}

async function demarrerCamera(){
  S.camOn = true; // bloque les redessins pendant le démarrage

    await qr.start({facingMode:'environment'},
      {fps:12, aspectRatio:1.333, qrbox:(w,h)=>({width:Math.max(120,Math.floor(Math.min(w*0.85,340))), height:Math.max(60,Math.floor(Math.min(h*0.45,150)))})},

async function arreterCamera(){
  lecture = false;
  if (qr){ try { if (qr.isScanning) await qr.stop(); qr.clear(); } catch(e){} qr = null; }
  S.camOn = false;
}

// Décodage d'un code : EAN classique, ou code à poids/prix variable (préfixe 2 par défaut, paramétrable).
function decoder(code){
  code = String(code).trim();
  const cv = S.params.codesVariables || {};
  const prefixes = String(cv.prefixes||'').split(',').map(s=>s.trim()).filter(Boolean);
  if (cv.actif && code.length===13 && /^\d+$/.test(code) && prefixes.some(p=>code.startsWith(p))){
    const article = code.substr(+cv.debutArticle||0, +cv.longArticle||7);
    const brut = parseInt(code.substr(+cv.debutValeur||7, +cv.longValeur||5), 10);
    const valeur = cv.typeValeur==='poids' ? brut/1000 : brut/100;
    return {code, cle:article, variable:true, typeValeur:cv.typeValeur, valeur};
  }
  return {code, cle:code, variable:false};
}
function traiterCode(code){
  const info = decoder(code);
  const p = S.produits.find(x => (x.codes||[]).includes(info.cle));
  if (p) ouvrirSaisie(p.id, info);
  else { toast('Code inconnu : crée la fiche produit.'); ouvrirFiche(null, {codes:[info.cle], uniteVente: info.variable ? 'kg' : 'unite'}, info); }
}

/* ---------- Saisie d'un mouvement ---------- */
function ouvrirSaisie(pid, info, preset){
  const p = prod(pid); if (!p) return;
  arreterCamera();
  let qte = '1';
  if (p.uniteVente==='kg') qte = '';
  if (info && info.variable){
    if (info.typeValeur==='poids') qte = String(r3(info.valeur));
    else if (isFinite(num(p.pv)) && num(p.pv)>0) qte = String(r3(info.valeur/num(p.pv)));
  }
  S.sheet = Object.assign({kind:'saisie', pid, info:info||null, action:'demarque', qte, motif:'', taux:String((S.params.tauxRemise||[30])[0]), note:'', lienId:null, err:''}, preset||{});
  render();
}
function sheetSaisie(){

  const rem = s.action==='demarque' ? remisesOuvertes(p.id) : [];
  const lienRem = s.lienId ? S.mouvements.find(m=>m.id===s.lienId) : null;
  const valPA = isFinite(q)&&isFinite(pa) ? q*pa : NaN, valPV = isFinite(q)&&isFinite(pv) ? q*pv : NaN;
  const coul = {demarque:'var(--dem)', don:'var(--don)', remise:'var(--rem)', retour:'var(--ret)'}[s.action];
  const libAction = {demarque:'Enregistrer la démarque', don:'Enregistrer le don', remise:'Enregistrer la remise', retour:'Enregistrer le retour'}[s.action];

  <div class="seg" style="margin:14px 0" role="group" aria-label="Type de saisie">${ACTIONS_V1.map(a=>`<button aria-pressed="${s.action===a}" onclick="A.set('action','${a}',true)">${esc(TYPES[a].nom.replace(' fournisseur',''))}</button>`).join('')}</div>

  ${lienRem ? `<p class="note">Produit remisé à −${fmtN(num(lienRem.taux),0)} % le ${esc(jourLong(lienRem.jour).toLowerCase())}, finalement jeté : compté en démarque au prix d’achat. <button class="btn sm" onclick="A.set('lienId',null,true)">Détacher</button></p>`:''}

  <label class="f"><span>Quantité</span><div class="qty"><button onclick="A.pas(-1)" aria-label="Moins">−</button><input type="text" inputmode="decimal" id="s_qte" value="${esc(s.qte)}" oninput="A.set('qte',this.value)"><span class="u">${esc(UNITES[u])}</span><button onclick="A.pas(1)" aria-label="Plus">+</button></div></label>

  ${s.action==='remise' ? `<div class="f"><span class="small muted" style="display:block;margin-bottom:6px">Taux de remise</span><div class="row wrap"><div class="chips">${(S.params.tauxRemise||[]).map(t=>`<button class="chip" aria-pressed="${String(s.taux)===String(t)}" onclick="A.set('taux','${t}',true)">−${t} %</button>`).join('')}</div>
  <input type="text" inputmode="decimal" style="max-width:110px" placeholder="Autre %" value="${(S.params.tauxRemise||[]).map(String).includes(String(s.taux))?'':esc(s.taux)}" oninput="A.set('taux',this.value)"></div>

function valeurSaisie(s,p){
  const q = num(s.qte), pa = num(p.pa), pv = num(p.pv);
  if (!isFinite(q) || q<=0) return 'Indique une quantité.';
  if (s.action==='remise'){ const t = num(s.taux); return isFinite(pv)&&isFinite(t) ? `Manque à gagner : ${eur(q*pv*t/100)}` : 'Ajoute le prix de vente dans la fiche pour chiffrer la remise.'; }
  if (!isFinite(pa)) return 'Pas de prix d’achat dans la fiche : la ligne sera enregistrée sans valeur.';
  return `Valeur : ${eur(q*pa)} au prix d’achat${isFinite(pv)&&!S.discret?`, ${eur(q*pv)} au prix de vente`:''}.`;
}
function enregistrer(){
  const s = S.sheet, p = prod(s.pid); if (!p) return;
  const q = num(s.qte);
  s.err = '';
  if (!isFinite(q) || q<=0) s.err = 'La quantité doit être supérieure à zéro.';
  else if (p.uniteVente!=='kg' && Math.abs(q-Math.round(q))>1e-9 && p.uniteVente==='piece') s.err = 'Un produit vendu à la pièce se compte en nombre entier.';
  else if (s.action==='demarque' && !s.motif) s.err = 'Choisis un motif de démarque.';
  else if (s.action==='remise' && !(num(s.taux)>0 && num(s.taux)<100)) s.err = 'Indique un taux de remise entre 1 et 99 %.';
  if (s.err){ renderSheet(); return; }
  const pa = num(p.pa), pv = num(p.pv), now = new Date();
  const m = {
    id: uid(), ts: now.toISOString(), jour: iso(now), type: s.action, sens: TYPES[s.action].sens,
    produitId: p.id, produitNom: p.nom, rayonId: p.rayonId||null,
    qte: r3(q), unite: p.uniteVente||'unite',
    pa: isFinite(pa)?pa:null, pv: isFinite(pv)?pv:null,
    valPA: isFinite(pa) ? r2(q*pa) : null, valPV: isFinite(pv) ? r2(q*pv) : null,
    motif: s.action==='demarque' ? s.motif : null,
    taux: s.action==='remise' ? num(s.taux) : null,
    manque: s.action==='remise' && isFinite(pv) ? r2(q*pv*num(s.taux)/100) : null,
    lienId: s.lienId || null,
    code: s.info ? s.info.code : null, montantEtiquette: s.info && s.info.variable && s.info.typeValeur==='prix' ? s.info.valeur : null,
    source: s.info ? 'scan' : 'manuel', note: (s.note||'').trim(),
    auteur: S.user ? S.user.uid : 'local', version: VERSION
  };
  Store.put('mouvements', m);
  if (!p.niveau) Store.put('produits', Object.assign({}, p, {niveau:1, majLe:now.toISOString()}));
  toast({demarque:'Démarque enregistrée', don:'Don enregistré', remise:'Remise enregistrée', retour:'Retour enregistré'}[s.action]);
  S.sheet = null;
  if (S.vue==='scanner'){ S.camErr=''; S.camPause = !S.rafale; }
  render();
}

function sauverFiche(){
  const s = S.sheet, p = s.p;
  const g = id => { const e = document.getElementById(id); return e ? e.value.trim() : ''; };
  const n = id => { const x = num(g(id)); return isFinite(x) ? x : null; };
  const codes = g('f_codes').split(/[,;\s]+/).map(c=>c.trim()).filter(Boolean);
  const maj = {
    nom:g('f_nom'), rayonId:g('f_rayon'), famille:g('f_famille'), codes: Array.from(new Set(codes)), plu:g('f_plu'),
    uniteVente:g('f_uv'), uniteCommande:g('f_uc'), parColis:n('f_parColis'), poidsMoyenPiece:n('f_pmp'),
    pa:n('f_pa'), pv:n('f_pv'), tva:n('f_tva'), dlcJours:n('f_dlc'),
    niveau: parseInt(g('f_niveau'),10)||0, tolerance:n('f_tol'), rendement:n('f_rdt'),
    stockSecurite:n('f_ss'), couvertureJours:n('f_couv'), fournisseur:g('f_four'),
    favori: $('#f_fav').checked, actif: $('#f_actif').checked, notes:g('f_notes')
  };
  Object.assign(p, maj);
  s.err = '';
  if (!p.nom) s.err = 'Donne un nom au produit.';
  else if (!p.rayonId) s.err = 'Choisis le rayon du produit.';
  else {
    const doublon = S.produits.find(x => x.id!==p.id && (x.codes||[]).some(c => p.codes.includes(c)));
    if (doublon) s.err = `Ce code-barres est déjà sur la fiche « ${doublon.nom} ».`;
    const mauvais = p.codes.find(c => eanValide(c)===false && !(S.params.codesVariables.actif && c.length<13));
    if (!s.err && mauvais) s.err = `Le code ${mauvais} a une clé de contrôle incorrecte : vérifie la saisie.`;
  }
  if (s.err){ renderSheet(); return; }
  const now = new Date().toISOString();
  if (!p.id){ p.id = uid(); p.creeLe = now; }
  p.majLe = now;
  Store.put('produits', p);
  toast('Fiche enregistrée');
  if (s.apres) ouvrirSaisie(p.id, s.apres);
  else { S.sheet = null; render(); }
}

    .sort((a,b)=> a.ts<b.ts?1:-1);

  return `<h2 style="margin-bottom:10px">Journal</h2>
  <div class="seg" role="group" aria-label="Période" style="margin-bottom:10px">${[['jour','Aujourd’hui'],['7j','7 jours'],['30j','30 jours'],['mois','Ce mois']].map(([k,l])=>`<button aria-pressed="${f.periode===k}" onclick="A.jf('periode','${k}')">${l}</button>`).join('')}</div>
  <div class="grid2">
    <select onchange="A.jf('type',this.value)" aria-label="Type"><option value="">Tous les types</option>${[...ACTIONS_V1,'annulation'].map(t=>`<option value="${t}" ${f.type===t?'selected':''}>${esc(TYPES[t].nom)}</option>`).join('')}</select>
    <select onchange="A.jf('rayon',this.value)" aria-label="Rayon"><option value="">Tous les rayons</option>${rayonsTries(true).map(r=>`<option value="${esc(r.id)}" ${f.rayon===r.id?'selected':''}>${esc(r.nom)}</option>`).join('')}</select>
  </div>
  ${ms.length ? Object.keys(parJour).map(j => `<div class="dayhead">${esc(jourLong(j))}</div><div class="list">${parJour[j].map(m => {
    const barre = ann.has(m.id);
    const extra = m.type==='demarque' ? motifNom(m.motif) : (m.type==='remise' ? '−'+fmtN(num(m.taux),0)+' %' : (m.type==='annulation' ? 'annule une saisie' : ''));
    const valeur = m.type==='remise' ? eur(num(m.manque)) : eur(num(m.valPA));
    return `<div class="item" style="cursor:default;${barre?'opacity:.5':''}">${tag(m.type)}<span class="grow"><span class="nm" style="${barre?'text-decoration:line-through':''}">${esc(m.produitNom)}</span>
    <span class="small muted">${esc(fmtQ(num(m.qte),m.unite))}${extra?', '+esc(extra):''}${m.lienId&&m.type==='demarque'?', après remise':''}${m.note?', '+esc(m.note):''}, ${heure(m.ts)}${barre?', annulée':''}</span></span>
    <span class="small num">${m.type!=='annulation'?valeur:''}</span>
    ${!barre && m.type!=='annulation' ? `<button class="btn sm" onclick="A.annuler('${esc(m.id)}')" aria-label="Annuler cette saisie">Annuler</button>`:''}</div>`; }).join('')}</div>`).join('')
  : '<div class="empty">Aucune saisie sur cette période.</div>'}
  <p class="tiny muted" style="margin-top:14px">Une saisie n’est jamais effacée : l’annuler ajoute une ligne d’annulation, pour garder la trace complète.</p>`;
}
function annuler(id){
  const m = S.mouvements.find(x=>x.id===id); if (!m) return;
  if (!confirm(`Annuler cette saisie ?\n${TYPES[m.type].nom} : ${m.produitNom}, ${fmtQ(num(m.qte),m.unite)}`)) return;
  const now = new Date();
  Store.put('mouvements', {id:uid(), ts:now.toISOString(), jour:iso(now), type:'annulation', sens:0, lienId:m.id,
    produitId:m.produitId, produitNom:m.produitNom, rayonId:m.rayonId, qte:m.qte, unite:m.unite,
    motif:null, note:'', source:'manuel', auteur:S.user?S.user.uid:'local', version:VERSION});
  toast('Saisie annulée');
}

/* ---------- Panneau ---------- */
function renderSheet(){
  const sh = $('#sheet'), veil = $('#veil');
  if (!S.sheet){ sh.classList.remove('open'); veil.classList.remove('open'); return; }
  const html = S.sheet.kind==='saisie' ? sheetSaisie() : sheetFiche();
  const y = sh.scrollTop;
  sh.innerHTML = html; sh.scrollTop = y;
  sh.classList.add('open'); veil.classList.add('open');
  if (S.sheet.err){ const e = sh.querySelector('.err'); if (e) e.scrollIntoView({block:'center'}); }
}

/* ---------- Téléchargement ---------- */
function telecharger(nom, contenu, type){
  const b = new Blob([contenu], {type}); const u = URL.createObjectURL(b);
  const a = document.createElement('a'); a.href = u; a.download = nom; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(u), 4000);
}

/* ============================================================
   ACTIONS (appelées depuis l'interface)
   ============================================================ */
window.A = {
  vue(v){ if (S.vue==='scanner' && v!=='scanner') arreterCamera(); if (v==='scanner'){ S.camErr=''; S.camPause=false; } S.vue = v; S.sheet = null; window.scrollTo(0,0); render(); },
  periode(p){ S.periode = p; render(); },
  discret(v){ S.discret = typeof v==='boolean' ? v : !S.discret; ls.set('stocks-discret', S.discret); render(); },
  rafale(v){ S.rafale = v; ls.set('stocks-rafale', v); },
  scanQ(v){ S.scanQ = v; const q = v.trim().toLowerCase();
    const res = q.length>=2 ? S.produits.filter(p => p.actif!==false && ((p.nom||'').toLowerCase().includes(q) || (p.plu||'')===q || (p.codes||[]).some(c=>c.includes(q)))).slice(0,20) : [];
    const el = $('#scanres'); if (el) el.innerHTML = resultatsRecherche(res,q); },
  codeManuel(){
    const c = S.scanQ.trim();
    if (!/^\d{4,14}$/.test(c)){ toast('Saisis un code composé de chiffres.'); return; }
    if (eanValide(c)===false && !decoder(c).variable){ toast('Clé de contrôle incorrecte : vérifie le code.'); return; }
    const plu = S.produits.find(p => p.plu===c);
    if (plu){ ouvrirSaisie(plu.id, null); return; }
    traiterCode(c);
  },
  relancerCam(){ S.camErr=''; S.camPause=false; render(); },
  saisie(pid){ ouvrirSaisie(pid, null); },
  nouveauProduit(){ const q = S.scanQ.trim(); ouvrirFiche(null, /^\d{6,14}$/.test(q) ? {codes:[q]} : (q ? {nom:q} : null)); },
  fiche(pid){ ouvrirFiche(pid); },
  set(k, v, redessiner){
    if (!S.sheet) return;
    S.sheet[k] = v;
    if (k==='action'){ S.sheet.err=''; if (v!=='demarque') S.sheet.lienId = null; }
    if (redessiner) renderSheet();
    else if (S.sheet.kind==='saisie'){ const e = $('#s_val'); const p = prod(S.sheet.pid); if (e && p) e.textContent = valeurSaisie(S.sheet, p); }
  },
  pas(d){
    const s = S.sheet, p = prod(s.pid); const step = p.uniteVente==='kg' ? 0.1 : 1;
    let q = num(s.qte); if (!isFinite(q)) q = 0;
    q = Math.max(0, r3(q + d*step)); s.qte = String(q);
    const e = $('#s_qte'); if (e) e.value = s.qte;
    const v = $('#s_val'); if (v) v.textContent = valeurSaisie(s, p);
  },
  jeterRemise(id){
    const r = S.mouvements.find(m=>m.id===id); if (!r) return;
    const reste = r3((num(r.qte)||0) - jeteSurRemise(id));
    Object.assign(S.sheet, {action:'demarque', lienId:id, qte:String(reste), motif:'perime', err:''});
    renderSheet();
  },
  enregistrer, sauverFiche, annuler,
  fermer(){ S.sheet = null; if (S.vue==='scanner') S.camErr=''; render(); },
  pf(k,v){ S.pf[k] = v; render(); if (k==='q'){ const e = $('#pf_q'); if (e){ e.focus(); e.setSelectionRange(v.length,v.length); } } },
  jf(k,v){ S.jf[k] = v; render(); },
  param(k,v){ const p = clone(S.params); p[k] = v; Store.params(p); },
  cv(k,v){ const p = clone(S.params); p.codesVariables[k] = (k==='actif'||k==='prefixes'||k==='typeValeur') ? v : (parseInt(v,10)||0); Store.params(p); },
  testCode(c){
    const e = $('#testcode'); if (!e) return;
    c = c.trim(); if (c.length!==13){ e.textContent = ''; return; }
    const d = decoder(c);
    if (!d.variable){ e.textContent = 'Code classique (non variable) avec ces réglages.'; return; }
    const p = S.produits.find(x=>(x.codes||[]).includes(d.cle));
    e.textContent = `Code article ${d.cle}${p?' ('+p.nom+')':', aucune fiche'} ; ${d.typeValeur==='poids' ? fmtN(d.valeur,3)+' kg' : fmtN(d.valeur,2)+' €'}.`;
  },
  tauxRemise(v){ const t = v.split(/[,;\s]+/).map(x=>parseInt(x,10)).filter(x=>x>0&&x<100); A.param('tauxRemise', t.length?t:[30,50]); },
  ajoutMotif(){ const n = prompt('Nom du nouveau motif de démarque'); if (!n||!n.trim()) return; const p = clone(S.params); p.motifs.push({id:'m-'+uid().slice(0,8), nom:n.trim(), actif:true}); Store.params(p); },
  majMotif(i,k,v){ const p = clone(S.params); if (!p.motifs[i]) return; p.motifs[i][k] = k==='nom' ? (v.trim()||p.motifs[i].nom) : v; Store.params(p); },
  ajoutRayon(){ const n = prompt('Nom du rayon'); if (!n||!n.trim()) return; Store.put('rayons', {id:uid(), nom:n.trim(), ordre:S.rayons.length, transformation:false, tolerance:null, fonctionnement:'', actif:true}); },
  majRayon(id,k,v){ const r = rayon(id); if (!r) return; const x = clone(r);
    if (k==='tolerance'){ const t = num(v); x.tolerance = isFinite(t) ? t : null; } else if (k==='nom'){ x.nom = v.trim()||x.nom; } else x[k] = v;
    Store.put('rayons', x); },
  ordreRayon(id,d){ const a = rayonsTries(true); const i = a.findIndex(r=>r.id===id); const j = i+d; if (j<0||j>=a.length) return;
    a.forEach((r,k)=>{ const o = k===i ? j : (k===j ? i : k); if (r.ordre!==o) Store.put('rayons', Object.assign(clone(r),{ordre:o})); }); },
  exportJSON(){ telecharger(`stocks-${MAG}-${iso(new Date())}.json`, JSON.stringify({application:'stocks', version:VERSION, magasin:MAG, exporteLe:new Date().toISOString(), params:S.params, rayons:S.rayons, produits:S.produits, mouvements:S.mouvements}, null, 1), 'application/json'); },
  exportCSV(){
    const ann = annules();
    const cols = ['date','heure','type','produit','rayon','quantite','unite','motif','taux_remise','valeur_achat_HT','valeur_vente_TTC','manque_a_gagner','apres_remise','annulee','note','code'];
    const n = x => (x==null||x==='' ? '' : String(x).replace('.',','));
    const lignes = S.mouvements.slice().sort((a,b)=>a.ts<b.ts?-1:1).map(m => [m.jour, heure(m.ts), (TYPES[m.type]||{nom:m.type}).nom, m.produitNom, (rayon(m.rayonId)||{nom:''}).nom, n(m.qte), m.unite, m.type==='demarque'?motifNom(m.motif):'', n(m.taux), n(m.valPA), n(m.valPV), n(m.manque), m.lienId&&m.type==='demarque'?'oui':'', ann.has(m.id)?'oui':'', m.note||'', m.code||'']);
    const csv = [cols, ...lignes].map(l => l.map(c => `"${String(c==null?'':c).replace(/"/g,'""')}"`).join(';')).join('\r\n');
    telecharger(`stocks-saisies-${iso(new Date())}.csv`, '\ufeff'+csv, 'text/csv;charset=utf-8');
  },
  importJSON(file){
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (d.application!=='stocks') throw new Error('format');
        const n = {r:(d.rayons||[]).length, p:(d.produits||[]).length, m:(d.mouvements||[]).length};
        if (!confirm(`Importer ${n.r} rayons, ${n.p} fiches et ${n.m} saisies ?`)) return;
        (d.rayons||[]).forEach(x=>Store.put('rayons',x)); (d.produits||[]).forEach(x=>Store.put('produits',x)); (d.mouvements||[]).forEach(x=>Store.put('mouvements',x));
        if (d.params) Store.params(deepMerge(DEF_PARAMS, d.params));
        toast('Import terminé');
      } catch(e){ toast('Ce fichier n’est pas un export de Stocks.'); }
    };
    r.readAsText(file);
  },
  async connexion(){
    const m = ($('#lg_mail')||{}).value, p = ($('#lg_mdp')||{}).value;
    if (!m || !p){ toast('Saisis l’e-mail et le mot de passe.'); return; }
    try { await auth.signInWithEmailAndPassword(m.trim(), p); }
    catch(e){ toast(e.code==='auth/invalid-credential'||e.code==='auth/wrong-password'||e.code==='auth/user-not-found' ? 'E-mail ou mot de passe incorrect.' : 'Connexion impossible : '+(e.code||'erreur')); }
  },
  async mdpOublie(){
    const m = ($('#lg_mail')||{}).value; if (!m){ toast('Saisis d’abord ton e-mail.'); return; }
    try { await auth.sendPasswordResetEmail(m.trim()); toast('E-mail de réinitialisation envoyé.'); } catch(e){ toast('Envoi impossible : '+(e.code||'erreur')); }
  },
  deconnexion(){ if (confirm('Se déconnecter de Stocks sur cet appareil ?')) auth.signOut(); }
};

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js').catch(()=>{});
